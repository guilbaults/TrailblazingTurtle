{% extends "admin/change_form.html" %}

{% block extrahead %}
{{ block.super }}
<script>
(function() {
    django.jQuery(document).ready(function($) {
        var $input = $('#id_clear_text_key');
        if ($input.length === 0) return;

        var $help = $input.closest('.help');

        var $btnWrap = $('<div></div>').css({
            marginTop: '4px',
            marginBottom: '8px'
        });

        var $genBtn = $('<button type="button">Generate</button>');
        var $toggleBtn = $('<button type="button">👁 Show</button>');

        $genBtn.on('click', function() {
            var arr = new Uint8Array(48);
            crypto.getRandomValues(arr);
            var val = btoa(String.fromCharCode.apply(null, arr))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=/g, '');
            $input.val(val).attr('type', 'password');
            $toggleBtn.text('👁 Show');
        });

        $toggleBtn.on('click', function() {
            if ($input.attr('type') === 'password') {
                $input.attr('type', 'text');
                $toggleBtn.text('👁 Hide');
            } else {
                $input.attr('type', 'password');
                $toggleBtn.text('👁 Show');
            }
        });

        $btnWrap.append($genBtn).append(' ').append($toggleBtn);

        if ($help.length) {
            $help.after($btnWrap);
        } else {
            $input.after($btnWrap);
        }
    });
})();
</script>
{% endblock extrahead %}
